<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      内联 SVG 图标：零额外文件，也顺手消掉浏览器自动请求 /favicon.ico 的 404。
      用家族品牌色（满版冰蓝 + 纯白图形），图形语义是"三根柱子"——这个工程画的就是图。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2361D9FB'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='17' width='4' height='8' rx='1'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1'/%3E%3Crect x='21' y='14' width='4' height='11' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ice-agent-console</title>
    <style>
      /*
       * 这一层是**真 DOM**，不是 canvas。
       *
       * ice-web-components 的立场是 "every pixel drawn by the engine"，但它适合的是
       * 应用外壳、表单、弹窗这类"自成一体的画布界面"。Thread 式消息流不行：
       * 消息要能选中复制、要能走输入法、要有浏览器原生的滚动惯性、要能被屏幕阅读器读。
       * 这些用 canvas 重做一遍只有坏处。
       *
       * 所以分界划在这儿：**DOM 管 thread 外壳，canvas 管卡片内容（图表）**。
       */
      :root {
        --ice: #61d9fb;
        --ice-deep: #0d7ea8;
        --bg: #f5f7fa;
        --panel: #ffffff;
        --line: #e2e8f0;
        --text: #1f2933;
        --muted: #6b7785;
        --radius: 10px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      #app {
        max-width: 980px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }

      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex: none;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        letter-spacing: 0.2px;
      }
      header h1 span { color: var(--ice-deep); }
      header .meta {
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      header .meta b { color: var(--text); font-weight: 600; }

      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 20px 20px 8px;
        scroll-behavior: smooth;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        margin-top: 64px;
        font-size: 13px;
        line-height: 2;
      }
      .empty code {
        background: #eef2f6;
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--ice-deep);
      }

      /* ---------- 消息（文字气泡） ---------- */
      .msg {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        align-items: flex-start;
      }
      .msg .who {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        background: var(--ice);
        color: #06414f;
      }
      .msg.user .who { background: #e5e9f0; color: #4a5568; }
      .msg .bubble {
        background: #f1f5f9;
        border-radius: var(--radius);
        padding: 8px 12px;
        max-width: 76%;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 20px;
      }
      .msg.user { flex-direction: row-reverse; }
      .msg.user .bubble { background: #e8f7fd; }
      .msg.user .who { order: 2; }

      /* ---------- 卡片（生成式 UI） ---------- */
      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin: 0 0 14px 40px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      .card > .card-head {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        background: #fafbfc;
      }
      .card > .card-head .title { color: var(--text); font-weight: 600; font-size: 13px; }
      .card > .card-head .status { margin-left: auto; }
      .card .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ice);
        box-shadow: 0 0 0 3px rgba(97, 217, 251, 0.2);
      }
      .card[data-status='streaming'] .dot { animation: pulse 1s ease-in-out infinite; }
      .card[data-status='error'] .dot { background: #e5484d; box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.18); }
      .card[data-status='done'] .dot { background: #30a46c; box-shadow: 0 0 0 3px rgba(48, 164, 108, 0.18); }
      @keyframes pulse { 50% { opacity: 0.25; } }

      .card .card-body { padding: 12px; }
      .card canvas { display: block; width: 100%; }

      /*
       * 控件层：卡片里的**第二块画布**（图表是第一块）。
       * 两条虚线把它跟图表分开，是为了让"这是另一张 canvas、另一个 ICE 实例"这件事
       * 在视觉上也是明确的 —— 否则它看起来就像图表的一部分。
       */
      .widget-wrap {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
      }
      .widget-wrap canvas { display: block; }

      /* 流式拼装中的参数（半成品 DSL）——这是 AG-UI 相对"只转个圈"的差别所在 */
      .args {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #0f172a;
        color: #b6e3f5;
        border-radius: 6px;
        padding: 10px 12px;
        max-height: 168px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
      }
      .args .cursor {
        display: inline-block;
        width: 7px; height: 13px;
        background: var(--ice);
        vertical-align: -2px;
        animation: pulse 1s ease-in-out infinite;
      }

      .diag {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
      }
      .diag li {
        padding: 7px 10px;
        border-radius: 6px;
        background: #fff5f5;
        border: 1px solid #ffd9d9;
        color: #a12b2b;
        margin-bottom: 6px;
      }
      .diag li.warn { background: #fffaeb; border-color: #ffe8b3; color: #8a6100; }
      .diag li code { color: inherit; opacity: 0.75; }

      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .hint b { color: var(--ice-deep); font-weight: 600; }

      /* ---------- 输入区 ---------- */
      footer {
        flex: none;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--line);
      }
      form {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #input {
        flex: 1;
        resize: none;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
        font: inherit;
        outline: none;
        min-height: 42px;
        max-height: 140px;
      }
      #input:focus { border-color: var(--ice); box-shadow: 0 0 0 3px rgba(97, 217, 251, 0.18); }
      #send {
        flex: none;
        height: 42px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius);
        background: var(--ice);
        color: #06414f;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled { opacity: 0.5; cursor: not-allowed; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
      .chip {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        cursor: pointer;
      }
      .chip:hover { border-color: var(--ice); color: var(--ice-deep); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ice-<span>agent</span>-console</h1>
        <div class="meta" id="meta"></div>
      </header>
      <div id="thread">
        <div class="empty">
          问一句，Agent 会把图表<strong>内联成卡片</strong>画在对话里。<br />
          试试 <code>看看各渠道的月度销量</code><br />
          想看自修复回路，试试 <code>故意画错</code>
        </div>
      </div>
      <footer>
        <div class="chips" id="chips"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
          <button id="send" type="submit">发送</button>
        </form>
      </footer>
    </div>
  </body>
</html>
