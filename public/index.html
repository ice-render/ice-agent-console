<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      内联 SVG 图标：零额外文件，也顺手消掉浏览器自动请求 /favicon.ico 的 404。
      用家族品牌色（满版冰蓝 + 纯白图形），图形语义是"三根柱子"——这个工程画的就是图。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2361D9FB'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='17' width='4' height='8' rx='1'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1'/%3E%3Crect x='21' y='14' width='4' height='11' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ice-agent-console</title>
    <style>
      /*
       * 布局：**绘图区是主体，对话浮在它上面。**
       *
       *   #stage   position:fixed; inset:0        ← 铺满视口，开页就画着工艺图
       *   #chat    position:fixed; right:gap;…    ← 浮在它右边缘上的一块面板
       *
       * 为什么绘图区不是"整块 canvas"而是"一个容器 + 可切换的图层"：
       * 引擎的模型是「一层 = 一块 canvas + 一个 ICE 实例」，而 `ice-chart` /
       * `WaterProcessDesigner` 各自都要独占实例。所以同一时刻容器里只挂一个图层。
       * 详见 `src/view/stage.ts` 的文件头。
       *
       * 另一半边界没变：**DOM 管对话与外壳，canvas 管绘图区**。
       * 消息要能选中复制、要走输入法、要有原生滚动惯性、要被屏幕阅读器读 ——
       * 这些用 canvas 重做一遍只有坏处。
       */
      /*
       * 颜色**不在这里写死** —— 下面这些变量由 `src/domain/theme.ts` 在启动时
       * 从 `ice-web-components` 的主题 token 表写进来（`applyThemeToCss()`）。
       *
       * 为什么这么做：这个界面是"DOM 外壳 + canvas 内容"两半拼的，两边各抄一套颜色
       * 必然漂 —— 试过一次：画布里的控件是 Bootstrap 深灰、外壳是另一套蓝，像两个应用。
       * 现在只有一份 token 表，两边都从它读。
       *
       * 这几行只是**兜底**（JS 没跑起来时不至于白屏），取值与默认主题一致（light）。
       * 想换主题用 `?theme=dark`，别改这里 —— 改这里只影响"JS 没跑起来"那一瞬。
       */
      :root {
        --bg: #f8f9fa;
        --panel: #ffffff;
        --elevated: #ffffff;
        --line: #dee2e6;
        --text: #212529;
        --muted: #6c757d;
        --hint: #adb5bd;
        --ice: #61d9fb;
        --ice-ink: #0d7ea8;
        --ice-soft: #cfe2ff;
        --ice-line: #9ec5fe;
        --ok: #198754;
        --warn: #ffc107;
        --err: #dc3545;
        --warn-bg: #fff3cd;
        --warn-line: #ffe69c;
        --warn-text: #664d03;
        --err-bg: #f8d7da;
        --err-line: #f1aeb5;
        --err-text: #58151c;
        --bubble-user: #cfe2ff;
        --bubble-agent: #f8f9fa;
        --code-bg: #0f172a;
        --code-fg: #b6e3f5;
        /* 浮层三件套：面板 / 控件条 / 表单靠它们跟"画着图的那一层"分开 */
        --overlay-bg: #ffffff;
        --overlay-line: #dee2e6;
        --overlay-shadow: 0 8px 28px rgba(15, 23, 42, 0.16);
        --radius: 10px;
        /* 对话面板的宽度与离边距。JS 不重算它们，只量——见 boot.ts 的 syncPanelInset */
        --chat-w: 380px;
        --chat-gap: 12px;
        color-scheme: light;
      }
      /* 主题名由 JS 写在 <html data-theme> 上；只用来切 color-scheme（滚动条、原生控件） */
      html[data-theme='dark'] { color-scheme: dark; }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* 绘图区是 fixed 铺满的，页面本身不滚 */
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      /* ================= 绘图区 ================= */

      #stage {
        position: fixed;
        inset: 0;
        background: var(--panel);
      }

      /*
       * 一层 = 一块 canvas + 一个 ICE 实例。`hidden` 时靠 UA 的 `[hidden]{display:none}`，
       * 所以这里**不要**给 `.stage-layer` 写 `display`。
       */
      .stage-layer { position: absolute; inset: 0; }
      .stage-layer canvas { display: block; }

      /* 图表图层：图表铺满，控件条浮在它底部（那是**第二块画布、第二个 ICE 实例**） */
      .stage-chart { position: absolute; left: 24px; right: 24px; top: 24px; bottom: 100px; }
      .stage-widget {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 20px;
        height: 56px;
        background: var(--overlay-bg);
        border: 1px solid var(--overlay-line);
        border-radius: 12px;
        box-shadow: var(--overlay-shadow);
      }
      .stage-widget canvas { display: block; }

      /*
       * 表单图层：一块居中浮在绘图区上的面板。
       *
       * 宽度取 `min(720px, …)` 而不是"铺满"：一行 1400 宽的输入框没人读得过来，
       * 而表单 DSL 自己也有内容上限（640）。**面板比那个上限宽一点**是刻意的 ——
       * 这样"内容有没有排到上限"在画布上还看得见（否则画布宽度就是内容宽度，
       * 两个意图会退化成同一个断言）。这条在 e2e 里有回归。
       *
       * 居中按 `--stage-usable-w`（绘图区**没被对话面板压住**的那部分宽度）算，
       * 由 boot.ts 量完写进来 —— 按整幅画布居中会让表单右半边钻到面板底下。
       */
      .stage-form {
        position: absolute;
        top: 32px;
        left: calc(var(--stage-usable-w, 100%) / 2);
        transform: translateX(-50%);
        width: min(720px, calc(100% - 64px));
        max-height: calc(100% - 64px);
        overflow: auto;
        background: var(--overlay-bg);
        border: 1px solid var(--overlay-line);
        border-radius: 14px;
        box-shadow: var(--overlay-shadow);
        padding: 20px 24px;
      }
      .stage-form canvas { display: block; }

      /* ================= 对话面板（浮层） ================= */

      #chat {
        position: fixed;
        top: var(--chat-gap);
        right: var(--chat-gap);
        bottom: var(--chat-gap);
        width: var(--chat-w);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--overlay-shadow);
        overflow: hidden;
      }
      /*
       * 折叠用 `transform` 推出去，**不是 `display:none`** ——
       * 那样里面滚不动、也拿不到 clientWidth（面板既然要能"再打开"，就得活着）。
       * 多推 `--chat-gap` 是让右边的外间距也一起出去，这样面板的左边缘真的落在视口外，
       * `syncPanelInset()` 量出来的遮盖宽度自然就是 0，不用为两种状态各写一条分支。
       *
       * 刻意**不做过渡**：面板滑出去要 200ms，而绘图区的重新居中是一瞬间的，
       * 两个一起放会显得脱节。少一个动画换来"按下就到位"的手感。
       */
      #chat[data-collapsed='true'] {
        transform: translateX(calc(100% + var(--chat-gap) + 8px));
      }

      #chat-toggle {
        position: fixed;
        top: var(--chat-gap);
        right: var(--chat-gap);
        z-index: 10;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--overlay-bg);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        box-shadow: var(--overlay-shadow);
      }
      #chat-toggle:hover { border-color: var(--ice); color: var(--ice-ink); }

      #chat header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex: none;
      }
      #chat header h1 {
        font-size: 14px;
        margin: 0;
        letter-spacing: 0.2px;
        flex: none;
      }
      #chat header h1 span { color: var(--ice-ink); }
      #chat header .meta {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        line-height: 1.4;
      }
      #chat header .meta b { color: var(--text); font-weight: 600; }
      #chat-collapse {
        flex: none;
        width: 26px;
        height: 26px;
        margin-left: 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--elevated);
        color: var(--muted);
        font: inherit;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      #chat-collapse:hover { border-color: var(--ice); color: var(--ice-ink); }

      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 14px 14px 6px;
        overscroll-behavior: contain;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        margin-top: 48px;
        font-size: 12.5px;
        line-height: 2;
      }
      .empty code {
        background: var(--elevated);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--ice);
      }

      /* ---------- 消息（文字气泡） ---------- */
      .msg {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        align-items: flex-start;
      }
      .msg .who {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        background: var(--ice);
        color: #06414f;
      }
      .msg.user .who { background: var(--elevated); color: var(--text); }
      .msg .bubble {
        background: var(--bubble-agent);
        border-radius: var(--radius);
        padding: 7px 11px;
        max-width: calc(100% - 40px);
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 20px;
        font-size: 13px;
      }
      .msg.user { flex-direction: row-reverse; }
      .msg.user .bubble { background: var(--bubble-user); }
      .msg.user .who { order: 2; }

      /* ---------- 工具条目（**没有画布**，画布在绘图区） ---------- */
      .tool-entry {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin: 0 0 12px 34px;
        overflow: hidden;
        background: var(--elevated);
      }
      /*
       * `data-active` = "绘图区上现在显示的就是这一条"。
       * 旧结构靠"卡片里那块画布"回答这个问题，现在画布只有一块，所以要在条目上标出来。
       */
      .tool-entry[data-active='true'] { border-color: var(--ice); }
      .tool-entry > .card-head {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .tool-entry > .card-head .title { color: var(--text); font-weight: 600; font-size: 12px; }
      .tool-entry > .card-head .status { margin-left: auto; }
      .tool-entry .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ice);
        box-shadow: 0 0 0 3px rgba(97, 217, 251, 0.2);
        flex: none;
      }
      .tool-entry[data-status='streaming'] .dot { animation: pulse 1s ease-in-out infinite; }
      .tool-entry[data-status='error'] .dot { background: var(--err); box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.22); }
      .tool-entry[data-status='done'] .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.22); }
      @keyframes pulse { 50% { opacity: 0.25; } }

      .tool-entry .card-body { padding: 10px; }

      /* 流式拼装中的参数（半成品 DSL）——这是 AG-UI 相对"只转个圈"的差别所在 */
      .args {
        font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* 半成品 DSL 的代码块：两种主题都用深底，跟"正文气泡"明确分开 */
        background: var(--code-bg);
        color: var(--code-fg);
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 150px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
      }
      .args .cursor {
        display: inline-block;
        width: 7px; height: 13px;
        background: var(--ice);
        vertical-align: -2px;
        animation: pulse 1s ease-in-out infinite;
      }

      .diag {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font-size: 11.5px;
      }
      .diag li {
        padding: 6px 9px;
        border-radius: 6px;
        background: var(--err-bg);
        border: 1px solid var(--err-line);
        color: var(--err-text);
        margin-bottom: 5px;
      }
      .diag li.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
      .diag li code { color: inherit; opacity: 0.75; }

      /*
       * 「这一轮失败了」那张提示卡。
       *
       * 为什么不只靠顶栏那行小字（`… · 出错 · Failed to fetch`）：失败时用户看到的是
       * "我发了一句话，然后什么都没发生" —— 面板里只有他自己那条消息，
       * 看上去像 AI 不理人。所以提示必须落在**对话流里**，而且要给出下一步动作。
       *
       * 用 `--err-*` 那三个 token（与 .diag 的诊断条目同色）：
       * 亮色 / 暗色主题下都由 theme.ts 写进 CSS 变量，这里不写死颜色。
       */
      .error-notice {
        margin: 4px 0 12px 34px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--err-bg);
        border: 1px solid var(--err-line);
        color: var(--err-text);
      }
      .error-notice .error-title {
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .error-notice .error-hint {
        font-size: 11.5px;
        line-height: 1.7;
        opacity: 0.9;
      }
      .error-notice .error-detail {
        margin-top: 6px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        opacity: 0.7;
        word-break: break-all;
      }

      .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.7;
      }
      .hint b { color: var(--ice-ink); font-weight: 600; }
      .hint code { opacity: 0.85; }

      /* ---------- 输入区 ---------- */
      #chat footer {
        flex: none;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--line);
      }
      #chat form {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #input {
        flex: 1;
        resize: none;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 9px 11px;
        font: inherit;
        font-size: 13px;
        outline: none;
        min-height: 40px;
        max-height: 140px;
        background: var(--elevated);
        color: var(--text);
      }
      #input::placeholder { color: var(--hint); }
      #input:focus { border-color: var(--ice); box-shadow: 0 0 0 3px rgba(97, 217, 251, 0.18); }
      #send {
        flex: none;
        height: 40px;
        padding: 0 16px;
        border: none;
        border-radius: var(--radius);
        background: var(--ice);
        color: #06414f;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled { opacity: 0.5; cursor: not-allowed; }
      .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
      /*
       * 组名：占满一整行（`flex-basis: 100%` 配合父级的 `flex-wrap`），
       * 于是"工艺图"那一组与"其他"那一组自然分成两块，不用另起容器。
       *
       * `margin-top` 给组间留一口气，但**第一组不要**（`first-child`）——
       * 否则按钮区顶部会凭空多出一段空白。
       */
      .chips .chip-group {
        flex: 1 0 100%;
        font-size: 10.5px;
        line-height: 1;
        color: var(--hint);
        letter-spacing: 0.4px;
        padding-left: 6px;
        border-left: 2px solid var(--line);
        margin: 6px 0 1px;
      }
      .chips .chip-group:first-child { margin-top: 0; }
      .chip {
        font-size: 11.5px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--elevated);
        color: var(--muted);
        cursor: pointer;
      }
      .chip:hover { border-color: var(--ice); color: var(--ice-ink); }
      /* 滚动条也跟着暗色，否则右边会亮一条 */
      #thread::-webkit-scrollbar, .args::-webkit-scrollbar { width: 9px; height: 9px; }
      #thread::-webkit-scrollbar-thumb, .args::-webkit-scrollbar-thumb {
        background: var(--line); border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <!-- 绘图区：铺满整个视口。开页就画着工艺图（boot.ts 里 mount 的） -->
    <div id="stage"></div>

    <!-- 面板折叠后露出来的那个小按钮 -->
    <button id="chat-toggle" type="button" hidden>AI 对话</button>

    <aside id="chat" data-collapsed="false">
      <header>
        <h1>ice-<span>agent</span>-console</h1>
        <div class="meta" id="meta"></div>
        <button id="chat-collapse" type="button" title="收起对话面板">›</button>
      </header>
      <div id="thread">
        <div class="empty">
          绘图区上已经是那张工艺图了 —— 它是<strong>开页就画好的</strong>，不会重画。<br />
          下面<strong>「工艺图」那一组</strong>的每个动作都作用在<strong>这一张</strong>图上：<br />
          <code>看看污水处理工艺图</code> 会带你把全流程走一遍（镜头跟着推近 + 高亮），<br />
          <code>把工艺图放大</code> / <code>让图元闪烁</code> 是查看动作，<br />
          <code>提标改造</code> 则直接<strong>改图</strong>（拆一处、加三处，而画面不重画）。
        </div>
      </div>
      <footer>
        <div class="chips" id="chips"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
          <button id="send" type="submit">发送</button>
        </form>
      </footer>
    </aside>
  </body>
</html>
